name: Publish Package

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag to checkout (e.g., v4.2.1-lineage-01)'
        required: true

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10']
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        # Ensure we checkout the specific tag for publishing
        ref: ${{ github.event.inputs.version_tag }}

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install wheel setuptools
        # For this specific project, it seems like 'make build' installs dependencies and builds the library
        # This might be needed if the build process generates files required for bdist_wheel
        make build

    - name: Build wheel
      run: python setup.py bdist_wheel

    - name: Upload wheel artifact
      uses: actions/upload-artifact@v3
      with:
        name: wheels-${{ matrix.python-version }}
        path: dist/*.whl

  build-sdist:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        ref: ${{ github.event.inputs.version_tag }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x' # Use a generic recent Python for sdist

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install setuptools
        # For this specific project, it seems like 'make build' installs dependencies and builds the library
        # This might be needed if the build process generates files required for sdist
        make build

    - name: Build sdist
      run: python setup.py sdist --formats=gztar

    - name: Upload sdist artifact
      uses: actions/upload-artifact@v3
      with:
        name: sdist
        path: dist/*.tar.gz

  publish-to-jfrog:
    needs: [build-wheel, build-sdist]
    runs-on: ubuntu-latest
    steps:
    - name: Download wheel artifacts
      uses: actions/download-artifact@v3
      with:
        path: dist_wheels
        # No name specified, will download all artifacts

    - name: Setup JFrog CLI
      uses: jfrog/setup-jfrog-cli@v3
      env:
        JF_ENV_JFROG_HOST: ${{ secrets.JFROG_HOST }} # Assuming JFROG_HOST is just the host, not protocol
        JF_ENV_JFROG_USER: ${{ secrets.JFROG_USER }} # Assuming user/token auth
        JF_ENV_JFROG_TOKEN: ${{ secrets.JFROG_ACCESS_TOKEN }}

    - name: List downloaded files for verification
      run: |
        ls -R dist_wheels
        mkdir -p final_dist
        find dist_wheels -name '*.whl' -exec cp {} final_dist/ \;
        find dist_wheels/sdist -name '*.tar.gz' -exec cp {} final_dist/ \;
        ls final_dist/

    - name: Publish to JFrog
      run: |
        jfrog rt u "final_dist/*.whl" "${{ secrets.PYTHON_STAGING_ARTIFACTORY }}/" --recursive=false
        jfrog rt u "final_dist/*.tar.gz" "${{ secrets.PYTHON_STAGING_ARTIFACTORY }}/" --recursive=false
      env:
        JFROG_HOST: ${{ secrets.JFROG_HOST }} # Make sure this is available for the jfrog command
        PYTHON_STAGING_ARTIFACTORY: ${{ secrets.PYTHON_STAGING_ARTIFACTORY }}
